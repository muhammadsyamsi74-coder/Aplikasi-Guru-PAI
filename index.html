<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Guru PAI - Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= CSS GLOBAL HIGH-TECH ================= */
        :root {
            --biru-tua: #0a192f;
            --biru-dasar: #007bff;
            --biru-neon: #00d2ff;
            --biru-muda: #e6f2ff;
            --putih: #ffffff;
            --abu-teks: #334155;
            --abu-latar: #f8fafc; /* Warna abu-abu sangat muda dan kalem */
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Latar belakang polos tanpa titik-titik */
            background-color: var(--abu-latar);
            color: var(--abu-teks);
            padding-bottom: 80px;
        }

        /* GLASSMORPHISM HEADER */
        .app-header {
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--putih);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 100;
        }

        .header-info h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--biru-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 210, 255, 0.2);
        }
        .header-info p { font-size: 11px; color: #94a3b8; font-weight: 500; letter-spacing: 0.5px;}

        .header-profile img {
            width: 45px; height: 45px; border-radius: 50%;
            border: 2px solid var(--biru-neon);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            object-fit: cover;
        }

        #main-content { padding: 20px; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* GLASSMORPHISM BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            display: flex; justify-content: space-around;
            padding: 12px 0 15px 0;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .sidebar-brand { display: none; }

        .nav-item {
            text-decoration: none; color: #94a3b8;
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item i { font-size: 20px; margin-bottom: 5px; transition: transform 0.3s ease; }

        /* Efek Pendar Menu Aktif */
        .nav-item.active { color: var(--biru-dasar); }
        .nav-item.active i {
            transform: translateY(-4px);
            color: var(--biru-neon);
            text-shadow: 0 4px 15px rgba(0, 210, 255, 0.6);
        }

        /* ================= SIDEBAR (DESKTOP) ================= */
        @media (min-width: 768px) {
            body { padding-bottom: 0; padding-left: 260px; }
            .bottom-nav {
                flex-direction: column; justify-content: flex-start;
                top: 0; left: 0; width: 260px; height: 100vh; padding-top: 20px;
                border-right: 1px solid rgba(255,255,255,0.6);
                box-shadow: 5px 0 30px rgba(0,0,0,0.03);
            }
            .sidebar-brand {
                display: block; padding: 0 25px 25px 25px; margin-bottom: 15px;
                border-bottom: 1px solid rgba(0,0,0,0.05);
            }
            .sidebar-brand h2 { font-size: 24px; color: var(--biru-tua); font-weight: 800; }
            .sidebar-brand span { color: var(--biru-neon); text-shadow: 0 2px 10px rgba(0,210,255,0.3); }
            
            .nav-item { flex-direction: row; padding: 16px 30px; font-size: 13px; gap: 18px; position: relative; }
            .nav-item i { margin-bottom: 0; width: 25px; font-size: 18px; text-align: center; }
            
            .nav-item.active {
                background: linear-gradient(90deg, rgba(0, 123, 255, 0.1) 0%, transparent 100%);
                border-right: none;
            }
            .nav-item.active::before {
                content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;
                background: var(--biru-neon); border-radius: 0 4px 4px 0;
                box-shadow: 2px 0 10px rgba(0, 210, 255, 0.6);
            }
            .nav-item.active i { transform: none; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-info">
            <h1 id="page-title">Presensi</h1>
            <p>Tahun Ajaran 2025/2026 - Ganjil</p>
        </div>
        <div class="header-profile">
            <img src="https://ui-avatars.com/api/?name=Guru+PAI&background=EBF4FF&color=0056b3" alt="Profil">
        </div>
    </header>

    <main id="main-content">
        <div style="text-align:center; padding: 50px 20px;">
            <p style="color:var(--biru-dasar); font-weight: 600;"><i class="fa-solid fa-satellite-dish fa-beat"></i> Memuat modul aplikasi...</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="sidebar-brand">
            <h2>Portal<span>PAI</span></h2>
        </div>
        <a href="#" class="nav-item active" id="nav-presensi" onclick="loadPage('presensi', 'Presensi Siswa')">
            <i class="fa-solid fa-clipboard-user"></i><span>Presensi</span>
        </a>
        <a href="#" class="nav-item" id="nav-penilaian" onclick="loadPage('penilaian', 'Penilaian')">
            <i class="fa-solid fa-clipboard-check"></i><span>Penilaian</span>
        </a>
        <a href="#" class="nav-item" id="nav-jurnal" onclick="loadPage('jurnal', 'Jurnal Guru')">
            <i class="fa-solid fa-book"></i><span>Jurnal</span>
        </a>
        <a href="#" class="nav-item" id="nav-master" onclick="loadPage('master', 'Data Master')">
            <i class="fa-solid fa-database"></i><span>Master</span>
        </a>
        <a href="#" class="nav-item" id="nav-paiapps" onclick="loadPage('paiapps', 'PAI-APPS')">
            <i class="fa-solid fa-toolbox"></i><span>PAI-APPS</span>
        </a>
    </nav>

    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/modules/master.js"></script>
    <script type="module" src="js/modules/presensi.js"></script>
    <script type="module" src="js/modules/penilaian.js"></script>
    <script type="module" src="js/modules/jurnal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
