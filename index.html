<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Guru PAI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= CSS GLOBAL: PREMIUM DARK NEON THEME ================= */
        :root {
            /* Palet Warna Mode Gelap */
            --bg-main: #0b121e;       /* Biru sangat gelap (nyaris hitam) untuk latar utama */
            --bg-card: #151d2a;       /* Biru gelap keabu-abuan untuk kotak/kartu */
            --bg-card-hover: #1b2534;
            --border-color: #232f40;  /* Garis batas samar */
            
            /* Teks */
            --text-putih: #ffffff;
            --text-abu: #8494a8;      /* Abu-abu terang untuk teks sekunder */
            
            /* Warna Aksen Neon */
            --neon-green: #05d58a;    /* Hijau Zamrud menyala */
            --neon-green-dim: rgba(5, 213, 138, 0.15);
            --neon-blue: #2563eb;
            --neon-red: #f43f5e;
            --neon-yellow: #f59e0b;
            
            /* Gradasi Tombol Simpan (Biru ke Hijau) */
            --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #05d58a 100%);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-putih);
            padding-bottom: 90px; /* Ruang untuk Bottom Nav */
            overflow-x: hidden;
        }

        /* HEADER GLOBAL (CLEAN DARK) */
        .app-header {
            background-color: var(--bg-main);
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; 
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-info h1 {
            font-size: 18px; 
            font-weight: 700;
            color: var(--text-putih);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .header-info p { 
            font-size: 11px; 
            color: var(--text-abu); 
            font-weight: 500; 
        }

        /* Badge Profil "GP" */
        .header-profile {
            width: 38px; height: 38px; 
            border-radius: 50%;
            background-color: var(--text-putih);
            color: var(--bg-main);
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 14px;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* WADAH KONTEN UTAMA */
        #main-content { 
            padding: 20px 15px; 
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* NAVIGASI BAWAH (MOBILE) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            padding: 12px 0 15px 0;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .sidebar-brand { display: none; }

        .nav-item {
            text-decoration: none; color: var(--text-abu);
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-item i { font-size: 20px; margin-bottom: 5px; transition: transform 0.3s ease; }

        /* Indikator Menu Aktif (Neon Green) */
        .nav-item.active { color: var(--neon-green); }
        .nav-item.active i {
            transform: translateY(-4px);
            color: var(--neon-green);
            text-shadow: 0 0 12px var(--neon-green);
        }

        /* ================= SIDEBAR (DESKTOP) ================= */
        @media (min-width: 768px) {
            body { padding-bottom: 0; padding-left: 260px; }
            
            .app-header {
                padding: 20px 30px;
            }

            #main-content { padding: 30px; margin-top: 0; max-width: 1200px;}

            .bottom-nav {
                flex-direction: column; justify-content: flex-start;
                top: 0; left: 0; width: 260px; height: 100vh; padding-top: 30px;
                border-top: none;
                border-right: 1px solid var(--border-color);
            }
            
            .sidebar-brand {
                display: block; padding: 0 25px 25px 25px; margin-bottom: 15px;
                border-bottom: 1px solid var(--border-color);
                text-align: center;
            }
            .sidebar-brand h2 { font-size: 22px; color: var(--text-putih); font-weight: 800; letter-spacing: 1px;}
            .sidebar-brand span { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green-dim); }
            
            .nav-item { 
                flex-direction: row; padding: 14px 25px; font-size: 13px; gap: 15px; 
                margin: 0 15px 5px 15px; border-radius: 12px;
            }
            .nav-item i { margin-bottom: 0; width: 25px; font-size: 16px; text-align: center; }
            
            .nav-item:hover { background-color: var(--bg-card-hover); color: var(--text-putih); }

            .nav-item.active {
                background-color: var(--neon-green-dim);
                color: var(--neon-green);
            }
            .nav-item.active i { transform: none; text-shadow: none; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-info">
            <h1 id="page-title">Presensi Siswa</h1>
            <p>Tahun Ajaran 2025/2026 - Ganjil</p>
        </div>
        <div class="header-profile">
            GP
        </div>
    </header>

    <main id="main-content">
        <div style="text-align:center; padding: 50px 20px;">
            <p style="color:var(--neon-green); font-weight: 600;"><i class="fa-solid fa-circle-notch fa-spin"></i> Memuat antarmuka...</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="sidebar-brand">
            <h2>Portal<span>PAI</span></h2>
        </div>
        <a href="#" class="nav-item active" id="nav-presensi" onclick="loadPage('presensi', 'Presensi Siswa')">
            <i class="fa-solid fa-clipboard-user"></i><span>Presensi</span>
        </a>
        <a href="#" class="nav-item" id="nav-penilaian" onclick="loadPage('penilaian', 'Penilaian')">
            <i class="fa-solid fa-clipboard-check"></i><span>Penilaian</span>
        </a>
        <a href="#" class="nav-item" id="nav-jurnal" onclick="loadPage('jurnal', 'Jurnal Guru')">
            <i class="fa-solid fa-book"></i><span>Jurnal</span>
        </a>
        <a href="#" class="nav-item" id="nav-master" onclick="loadPage('master', 'Data Master')">
            <i class="fa-solid fa-database"></i><span>Master</span>
        </a>
        <a href="#" class="nav-item" id="nav-paiapps" onclick="loadPage('paiapps', 'PAI-APPS')">
            <i class="fa-solid fa-toolbox"></i><span>PAI-APPS</span>
        </a>
    </nav>

    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/modules/master.js"></script>
    <script type="module" src="js/modules/presensi.js"></script>
    <script type="module" src="js/modules/penilaian.js"></script>
    <script type="module" src="js/modules/jurnal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
