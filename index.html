<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Guru PAI</title>
    
    <!-- PENGHUBUNG MANIFEST PWA & IKON APLIKASI -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/logo_aplikasi.png">
    <link rel="apple-touch-icon" href="assets/icon-512.png">
    <meta name="theme-color" content="#0b121e" id="meta-theme-color">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= CSS GLOBAL: DUA TEMA (DARK & LIGHT) ================= */
        
        /* 1. TEMA GELAP (DEFAULT) */
        :root, [data-theme="dark"] {
            --bg-main: #0b121e;       
            --bg-card: #151d2a;       
            --bg-card-hover: #1b2534;
            --border-color: #232f40;  
            --text-putih: #ffffff;
            --text-abu: #8494a8;      
            --neon-green: #05d58a;    
            --neon-blue: #3b82f6;
            --neon-purple: #a855f7;
            --neon-cyan: #38bdf8;
            --neon-red: #f43f5e;
            --neon-yellow: #f59e0b;

            /* PALET GLASSMORPHISM DARK INDIGO */
            --glass-bg: rgba(14, 22, 38, 0.88);
            --glass-border: rgba(99, 102, 241, 0.25);
            --gradient-accent: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(168, 85, 247, 0.25) 100%);
            --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #05d58a 100%);
            --gradient-blue: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --gradient-purple: linear-gradient(135deg, #4c1d95 0%, #8b5cf6 100%);
            --gradient-yellow: linear-gradient(135deg, #b45309 0%, #f59e0b 100%);
            --gradient-red: linear-gradient(135deg, #7f1d1d 0%, #ef4444 100%);
            
            --border-blue-subtle: rgba(59, 130, 246, 0.28);
            --border-green-subtle: rgba(5, 213, 138, 0.3);
            --border-yellow-subtle: rgba(245, 158, 11, 0.3);
            --border-purple-subtle: rgba(168, 85, 247, 0.3);
            --border-emerald-subtle: rgba(16, 185, 129, 0.35);
            --border-red-subtle: rgba(239, 68, 68, 0.3);
        }

        /* 2. TEMA TERANG (LIGHT MODE) */
        [data-theme="light"] {
            --bg-main: #f1f5f9;       
            --bg-card: #ffffff;       
            --bg-card-hover: #f8fafc;
            --border-color: #cbd5e1;  
            --text-putih: #0f172a;    /* Berubah menjadi teks gelap utama */
            --text-abu: #64748b;      
            --neon-green: #059669;    
            --neon-blue: #2563eb;
            --neon-purple: #7c3aed;
            --neon-cyan: #0284c7;
            --neon-red: #e11d48;
            --neon-yellow: #d97706;

            /* PALET GLASSMORPHISM LIGHT */
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(203, 213, 225, 0.8);
            --gradient-accent: linear-gradient(135deg, rgba(37, 99, 235, 0.12) 0%, rgba(124, 58, 237, 0.12) 100%);
            --gradient-primary: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --gradient-blue: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            --gradient-purple: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%);
            --gradient-yellow: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            --gradient-red: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);

            --border-blue-subtle: rgba(37, 99, 235, 0.25);
            --border-green-subtle: rgba(5, 150, 105, 0.25);
            --border-yellow-subtle: rgba(217, 119, 6, 0.25);
            --border-purple-subtle: rgba(124, 58, 237, 0.25);
            --border-emerald-subtle: rgba(16, 185, 129, 0.3);
            --border-red-subtle: rgba(225, 29, 72, 0.25);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-putih);
            padding-bottom: 90px; 
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* HEADER GLOBAL */
        .app-header {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; 
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
        }

        .header-info h1 {
            font-size: 18px; 
            font-weight: 700;
            color: var(--text-putih);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .header-info p { 
            font-size: 11px; 
            color: var(--text-abu); 
            font-weight: 500; 
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tombol Toggle Tema */
        .btn-theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--neon-yellow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-theme-toggle:active { transform: scale(0.9); }

        /* Badge Profil */
        .header-profile {
            width: 36px; height: 36px; 
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--neon-cyan);
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 15px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            overflow: hidden; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .header-profile:active { transform: scale(0.9); }

        /* WADAH KONTEN UTAMA */
        #main-content { 
            padding: 20px 15px; 
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* NAVIGASI BAWAH (MOBILE) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            display: flex; justify-content: space-around;
            padding: 10px 8px 12px 8px;
            z-index: 1000;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
            transition: background 0.3s ease;
        }

        .sidebar-brand { display: none; }

        .nav-item {
            text-decoration: none; 
            color: var(--text-abu);
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 600;
            padding: 6px 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-item i { font-size: 19px; margin-bottom: 4px; transition: all 0.3s ease; }

        .nav-item.active { 
            color: var(--text-putih); 
            background: var(--gradient-accent);
            border: 1px solid var(--border-purple-subtle);
        }
        .nav-item.active i {
            transform: translateY(-2px);
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        /* ================= FORM & MODAL PROFIL ================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 2000; display: none;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh;
            overflow-y: auto; padding: 25px; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-out;
        }
        .modal-content::-webkit-scrollbar { width: 5px; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }

        .modal-close {
            position: absolute; top: 20px; right: 20px; background: none; border: none;
            color: var(--neon-red); font-size: 22px; cursor: pointer; transition: 0.2s;
        }
        .modal-close:hover { transform: scale(1.1); }

        .form-group { margin-bottom: 12px; width: 100%; }
        .form-group label { display: block; font-size: 10px; color: var(--text-abu); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .form-control { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; 
            font-size: 12px; color: var(--text-putih); background: var(--bg-main); outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--neon-cyan); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-primary { 
            background: var(--gradient-primary); border: none; border-radius: 12px; color: white; 
            font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.3s; display:flex; justify-content:center; align-items:center;
        }
        .btn-primary:active { transform: scale(0.97); }

        /* ================= SIDEBAR & HEADER (DESKTOP) ================= */
        @media (min-width: 768px) {
            body { padding-bottom: 0; padding-left: 260px; }
            
            .header-profile { display: none !important; }
            
            .app-header { 
                padding: 18px 35px; 
                max-width: 1200px; 
                margin: 0 auto; 
                background: transparent;
                border-bottom: 1px solid var(--border-color);
                box-shadow: none;
            }
            .header-info h1 { font-size: 22px; }

            #main-content { padding: 30px 35px; margin: 0 auto; max-width: 1200px; }
            
            .bottom-nav {
                flex-direction: column; justify-content: flex-start;
                top: 0; left: 0; width: 260px; height: 100vh; padding: 25px 12px 20px 12px;
                border-top: none; 
                border-top-left-radius: 0; 
                border-top-right-radius: 0;
                border-right: 1px solid var(--glass-border);
                background: var(--glass-bg);
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.1);
            }
            
            .sidebar-brand {
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: 0 10px 20px 10px; margin-bottom: 20px; cursor: pointer;
                border-bottom: 1px solid var(--border-color); text-align: center;
                transition: transform 0.2s;
            }
            .sidebar-brand:active { transform: scale(0.96); }
            
            .sidebar-brand img {
                width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
                object-position: top;
                border: 2px solid var(--neon-cyan); margin-bottom: 12px;
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            }
            .sidebar-brand .default-icon {
                width: 76px; height: 76px; border-radius: 50%; background: var(--bg-card); 
                display: flex; justify-content: center; align-items: center; 
                border: 2px solid var(--neon-cyan); margin-bottom: 12px;
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            }
            .sidebar-brand h3 { font-size: 14px; font-weight: 700; color: var(--text-putih); margin-bottom: 4px; line-height: 1.2; }
            .sidebar-brand p { font-size: 11px; font-weight: 500; color: var(--text-abu); line-height: 1.2; margin: 0; }

            .nav-item { 
                flex-direction: row; padding: 13px 18px; font-size: 13px; gap: 14px; 
                margin-bottom: 6px; border-radius: 12px; color: var(--text-abu); 
            }
            .nav-item i { margin-bottom: 0; width: 22px; font-size: 16px; text-align: center; }
            .nav-item:hover { 
                background-color: var(--bg-card); 
                color: var(--text-putih); 
            }
            .nav-item.active { 
                background: var(--gradient-accent); 
                color: var(--text-putih);
                border: 1px solid var(--border-purple-subtle);
                box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1);
            }
            .nav-item.active i { 
                transform: none; 
                color: var(--neon-cyan); 
                text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); 
            }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-info">
            <h1 id="page-title">Presensi Siswa</h1>
            <p id="header-subtitle">Tahun Ajaran Aktif - Memuat...</p>
        </div>
        
        <div class="header-actions">
            <!-- Tombol Switch Tema Gelap / Terang -->
            <button class="btn-theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Ubah Tema">
                <i class="fa-solid fa-sun" id="icon-toggle-theme"></i>
            </button>
            
            <!-- Pemicu Modal Mobile: Klik di profil -->
            <div class="header-profile" id="profile-btn" onclick="handleProfileClick()">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div style="text-align:center; padding: 50px 20px;">
            <p style="color:var(--neon-green); font-weight: 600;"><i class="fa-solid fa-circle-notch fa-spin"></i> Memuat antarmuka...</p>
        </div>
    </main>

    <!-- MODAL PROFIL APLIKASI -->
    <div id="modal-profil" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('modal-profil').style.display='none'"><i class="fa-solid fa-times"></i></button>
            <h3 style="color:var(--neon-blue); margin-bottom:20px; font-weight:700;"><i class="fa-solid fa-user-gear"></i> Pengaturan Profil</h3>
            
            <form onsubmit="simpanProfil(event)">
                <input type="hidden" id="current-foto-url">
                
                <h4 style="font-size:12px; color:var(--neon-green); border-bottom:1px solid var(--border-color); padding-bottom:5px; margin-bottom:10px;">Data Guru</h4>
                <div class="form-group">
                    <label>Nama Guru Lengkap</label>
                    <input type="text" id="prof-nama-guru" class="form-control" required>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;"><label>NIP Guru</label><input type="text" id="prof-nip" class="form-control"></div>
                    <div class="form-group" style="flex:1;"><label>WhatsApp</label><input type="text" id="prof-wa" class="form-control"></div>
                </div>
                <div class="form-group"><label>Email</label><input type="email" id="prof-email" class="form-control"></div>
                
                <div class="form-group">
                    <label>Foto Profil (Otomatis Dikompres)</label>
                    <input type="file" id="prof-foto" class="form-control" accept="image/*">
                </div>
                
                <h4 style="font-size:12px; color:var(--neon-green); border-bottom:1px solid var(--border-color); padding-bottom:5px; margin-bottom:10px; margin-top:20px;">Data Sekolah & Sistem</h4>
                <div class="form-group">
                    <label>Nama Sekolah</label>
                    <input type="text" id="prof-sekolah" class="form-control" value="SMPN 8 Balikpapan" required>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;"><label>NPSN</label><input type="text" id="prof-npsn" class="form-control"></div>
                    <div class="form-group" style="flex:1;"><label>Tahun Ajaran</label><input type="text" id="prof-ta" class="form-control" placeholder="Cth: 2025/2026"></div>
                    <div class="form-group" style="flex:1;">
                        <label>Semester</label>
                        <select id="prof-semester" class="form-control">
                            <option value="Ganjil">Ganjil</option>
                            <option value="Genap">Genap</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Alamat Sekolah</label><input type="text" id="prof-alamat" class="form-control"></div>
                
                <button type="submit" id="btn-simpan-profil" class="btn-primary" style="width:100%; margin-top:20px; padding:12px;">
                    <i class="fa-solid fa-save" style="margin-right:8px;"></i> Simpan Pengaturan
                </button>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <!-- Pemicu Modal Desktop: Klik di area profil sidebar -->
        <div class="sidebar-brand" id="sidebar-brand" onclick="handleProfileClick()">
            <div class="default-icon"><i class="fa-solid fa-user" style="font-size:28px; color:var(--neon-cyan);"></i></div>
            <h3>Memuat Profil...</h3>
            <p>Sistem Administrasi</p>
        </div>
        
        <a href="#" class="nav-item active" id="nav-presensi" onclick="loadPage('presensi', 'Presensi Siswa')">
            <i class="fa-solid fa-clipboard-user"></i><span>Presensi</span>
        </a>
        <a href="#" class="nav-item" id="nav-penilaian" onclick="loadPage('penilaian', 'Penilaian')">
            <i class="fa-solid fa-clipboard-check"></i><span>Penilaian</span>
        </a>
        <a href="#" class="nav-item" id="nav-jurnal" onclick="loadPage('jurnal', 'Jurnal Guru')">
            <i class="fa-solid fa-book"></i><span>Jurnal</span>
        </a>
        <a href="#" class="nav-item" id="nav-master" onclick="loadPage('master', 'Data Master')">
            <i class="fa-solid fa-database"></i><span>Master</span>
        </a>
        <a href="#" class="nav-item" id="nav-paiapps" onclick="loadPage('paiapps', 'PAI-APPS')">
            <i class="fa-solid fa-toolbox"></i><span>PAI-APPS</span>
        </a>
    </nav>

    <!-- SCRIPT TEMA (LOCAL STORAGE & SWITCHER) -->
    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app-theme', theme);
            
            const metaColor = document.getElementById('meta-theme-color');
            if (metaColor) {
                metaColor.setAttribute('content', theme === 'dark' ? '#0b121e' : '#f1f5f9');
            }

            const icon = document.getElementById('icon-toggle-theme');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
                icon.style.color = theme === 'dark' ? 'var(--neon-yellow)' : 'var(--neon-purple)';
            }
        }

        window.toggleTheme = function() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const nextTheme = current === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
        };

        // Inisialisasi tema instan saat halaman dibuka
        const savedTheme = localStorage.getItem('app-theme') || 'dark';
        applyTheme(savedTheme);
    </script>


<!-- GANTI HANYA DENGAN SATU BARIS INI: -->
<script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW fail', err));
        }
    </script>
</body>
</html>
