<!-- pages/penilaian.html -->
<style>
    .penilaian-container { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .section-title { font-size: 18px; font-weight: 700; color: var(--biru-tua); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    
    /* KARTU MELAYANG (GLASSMORPHISM) */
    .card-data { 
        background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.8); margin-bottom: 20px; 
        box-shadow: 0 10px 30px rgba(31, 38, 135, 0.05); transition: transform 0.3s ease; 
    }
    .card-data:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(31, 38, 135, 0.08); }
    
    .form-group { margin-bottom: 15px; width: 100%; }
    .form-group label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { 
        width: 100%; padding: 12px; border: 1px solid rgba(0, 123, 255, 0.2); border-radius: 10px; 
        font-size: 13px; color: var(--biru-tua); outline: none; transition: all 0.3s ease; 
        background: rgba(255,255,255,0.9); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); font-weight: 500;
    }
    .form-control:focus { border-color: var(--biru-neon); box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); background: #fff; }
    
    /* DESAIN TAB MELAYANG */
    .tab-container { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
    .tab-container::-webkit-scrollbar { display: none; }
    .tab-btn { 
        background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); padding: 10px 20px; 
        font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; white-space: nowrap; 
        transition: all 0.3s; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .tab-btn.active { background: linear-gradient(135deg, var(--biru-tua), var(--biru-dasar)); color: white; border: none; box-shadow: 0 6px 15px rgba(0, 86, 179, 0.3); }
    
    /* DESAIN STUDENT CARD & ACCORDION (High-Tech) */
    .absen-card { display: flex; flex-direction: column; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
    .absen-info-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .absen-identity { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .absen-no { font-weight: 700; color: var(--biru-muda); background: var(--biru-tua); padding: 4px 10px; border-radius: 6px; font-size: 11px; }
    .absen-nama { font-size: 13px; font-weight: 600; color: var(--abu-teks); }
    .btn-toggle-input { background: #eff6ff; color: var(--biru-dasar); border: none; padding: 6px 12px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .btn-toggle-input:hover { background: var(--biru-dasar); color: white; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,123,255,0.2); }

    /* STATUS BADGE */
    .badge-status { font-size: 9px; padding: 3px 8px; border-radius: 12px; font-weight: 800; letter-spacing: 0.5px; margin-left: 5px; }
    .bg-belum { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; }
    .bg-sebagian { background: #fef9c3; color: #d97706; border: 1px solid #fde047; }
    .bg-sudah { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

    /* LAYOUT TUGAS T/TS */
    .wrap-tugas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn-tuntas { width: 40px; height: 38px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #94a3b8; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .btn-tuntas.active.t { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
    .btn-tuntas.active.ts { background: linear-gradient(135deg, #dc3545, #f87171); color: white; border: none; box-shadow: 0 4px 10px rgba(220,53,69,0.3); }

    /* LAYOUT KOMPONEN BANYAK (GRID) */
    .grid-input-nilai { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; margin-bottom: 10px; }
    .hafalan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.01); }
    .hafalan-item { display: flex; flex-direction: column; gap: 4px; }
    .hafalan-label { font-size: 10px; font-weight: 700; color: var(--biru-tua); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sel-kecil { padding: 8px; font-size: 11px; height: auto; border-radius: 8px; }

    /* TOMBOL GRADASI & GLOW */
    .btn-primary {
        background: linear-gradient(135deg, var(--biru-dasar), var(--biru-neon)); border: none; border-radius: 10px;
        color: white; font-weight: 600; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(0, 210, 255, 0.2); }

    @media (min-width: 768px) {
        .desktop-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 15px; }
        .desktop-row .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }
        .grid-input-nilai { grid-template-columns: repeat(2, 1fr); }
        .hafalan-grid { grid-template-columns: repeat(4, 1fr); }
    }
</style>

<div class="penilaian-container">
    <h2 class="section-title"><i class="fa-solid fa-clipboard-check"></i> Modul Penilaian</h2>
    
    <div class="tab-container">
        <button class="tab-btn active" id="btn-tab-tugas" onclick="gantiTabPenilaian('tugas')">Nilai Tugas</button>
        <button class="tab-btn" id="btn-tab-baca" onclick="gantiTabPenilaian('baca')">Baca Qur'an</button>
        <button class="tab-btn" id="btn-tab-tulis" onclick="gantiTabPenilaian('tulis')">Menulis Qur'an</button>
        <button class="tab-btn" id="btn-tab-sholat" onclick="gantiTabPenilaian('sholat')">Hafalan Sholat</button>
        <button class="tab-btn" id="btn-tab-surah" onclick="gantiTabPenilaian('surah')">Surah Pendek</button>
    </div>

    <!-- ================= TAB 1: PENILAIAN TUGAS ================= -->
    <div id="tab-penilaian-tugas" style="display: block;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-tugas" class="form-control" onchange="bukaFormPenilaian('tugas')"></select>
            </div>
            <div id="area-tugas" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                
                <div class="form-group" style="background: rgba(0,123,255,0.05); padding: 15px; border-radius: 12px; border: 1px dashed rgba(0,123,255,0.3);">
                    <label>Pilih Tugas (Tersimpan) atau Buat Baru</label>
                    <div class="desktop-row" style="margin-bottom: 0;">
                        <div class="form-group" style="flex: 2;">
                            <select id="input-nama-tugas-dropdown" class="form-control" onchange="loadNilaiTugas()">
                                <option value="">-- Pilih Tugas --</option>
                            </select>
                            <input type="text" id="input-nama-tugas-baru" class="form-control" placeholder="Ketik nama tugas baru di sini..." style="display:none; margin-top:8px;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <button type="button" onclick="toggleTugasBaru()" class="btn-primary" style="width: 100%; background: linear-gradient(135deg, #6c757d, #adb5bd); box-shadow: 0 4px 10px rgba(108, 117, 125, 0.2); font-size:11px; padding:12px;">
                                <i class="fa-solid fa-plus"></i> Buat Tugas Baru
                            </button>
                        </div>
                    </div>
                </div>

                <div id="tempat-list-tugas" style="margin-top: 15px;"></div>
                
                <button onclick="simpanPenilaian('tugas')" id="btn-simpan-tugas" class="btn-primary" style="width: 100%; margin-top: 20px;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Nilai Tugas
                </button>
            </div>
        </div>
    </div>

    <!-- ================= TAB 2: BACA QURAN ================= -->
    <div id="tab-penilaian-baca" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-baca" class="form-control" onchange="bukaFormPenilaian('baca')"></select>
            </div>
            <div id="area-baca" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div id="tempat-list-baca"></div>
                <button onclick="simpanPenilaian('baca')" id="btn-simpan-baca" class="btn-primary" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Nilai Baca Qur'an
                </button>
            </div>
        </div>
    </div>

    <!-- ================= TAB 3: MENULIS QURAN ================= -->
    <div id="tab-penilaian-tulis" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-tulis" class="form-control" onchange="bukaFormPenilaian('tulis')"></select>
            </div>
            <div id="area-tulis" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div id="tempat-list-tulis"></div>
                <button onclick="simpanPenilaian('tulis')" id="btn-simpan-tulis" class="btn-primary" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, #10b981, #34d399); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Nilai Menulis Qur'an
                </button>
            </div>
        </div>
    </div>

    <!-- ================= TAB 4: HAFALAN SHOLAT ================= -->
    <div id="tab-penilaian-sholat" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-sholat" class="form-control" onchange="bukaFormPenilaian('sholat')"></select>
            </div>
            <div id="area-sholat" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div id="tempat-list-sholat"></div>
                <button onclick="simpanPenilaian('sholat')" id="btn-simpan-sholat" class="btn-primary" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, #8b5cf6, #a78bfa); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Hafalan Sholat
                </button>
            </div>
        </div>
    </div>

    <!-- ================= TAB 5: SURAH PENDEK ================= -->
    <div id="tab-penilaian-surah" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-surah" class="form-control" onchange="bukaFormPenilaian('surah')"></select>
            </div>
            <div id="area-surah" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div id="tempat-list-surah"></div>
                <button onclick="simpanPenilaian('surah')" id="btn-simpan-surah" class="btn-primary" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Hafalan Surah
                </button>
            </div>
        </div>
    </div>
</div>
