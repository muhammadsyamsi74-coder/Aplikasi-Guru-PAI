<!-- pages/presensi.html -->
<style>
    .presensi-container { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .section-title { font-size: 18px; font-weight: 700; color: var(--biru-tua); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    
    /* KARTU MELAYANG (GLASSMORPHISM) */
    .card-data { 
        background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.8); margin-bottom: 20px; 
        box-shadow: 0 10px 30px rgba(31, 38, 135, 0.05); transition: transform 0.3s ease; 
    }
    .card-data:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(31, 38, 135, 0.08); }
    
    .form-group { margin-bottom: 15px; width: 100%; }
    .form-group label { display: block; font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { 
        width: 100%; padding: 12px; border: 1px solid rgba(0, 123, 255, 0.2); border-radius: 10px; 
        font-size: 13px; color: var(--biru-tua); outline: none; transition: all 0.3s ease; 
        background: rgba(255,255,255,0.9); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); font-weight: 500;
    }
    .form-control:focus { border-color: var(--biru-neon); box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); background: #fff; }
    
    /* TOMBOL GRADASI & GLOW */
    .btn-primary {
        background: linear-gradient(135deg, var(--biru-dasar), var(--biru-neon)); border: none; border-radius: 10px;
        color: white; font-weight: 600; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(0, 210, 255, 0.2); }

    /* DESAIN TAB MELAYANG */
    .tab-container { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
    .tab-btn { 
        background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); padding: 10px 20px; 
        font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; white-space: nowrap; 
        transition: all 0.3s; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .tab-btn.active { background: linear-gradient(135deg, var(--biru-tua), var(--biru-dasar)); color: white; border: none; box-shadow: 0 6px 15px rgba(0, 86, 179, 0.3); }

    /* =========================================================
       SISTEM TABEL ABSENSI HORIZONTAL MURNI
       ========================================================= */
    .header-tabel-presensi {
        display: flex; align-items: center; padding: 10px 5px; margin-bottom: 5px;
        font-size: 9px; font-weight: 800; color: #64748b; text-transform: uppercase; 
        border-bottom: 2px solid var(--biru-muda); letter-spacing: 0.5px;
    }

    /* 1 Baris Penuh (Dilarang Turun) */
    .absen-card {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: flex-start !important;
        flex-wrap: nowrap !important;
        gap: 5px !important;
        padding: 8px 5px !important;
        background: rgba(255, 255, 255, 0.8) !important; 
        border: 1px solid #e2e8f0 !important;
        border-radius: 10px !important; 
        margin-bottom: 8px !important; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.02) !important;
        overflow: hidden;
    }

    /* No & Nama (Di-press ke Kiri) */
    .absen-no { 
        min-width: 22px !important; height: 22px !important; flex-shrink: 0;
        display: flex !important; justify-content: center !important; align-items: center !important; 
        border-radius: 6px !important; background: var(--biru-muda) !important; 
        color: var(--biru-tua) !important; font-weight: 700 !important; font-size: 10px !important;
    }
    .absen-nama { 
        font-size: 11px !important; font-weight: 600 !important; color: var(--abu-teks) !important;
        white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; 
        flex-grow: 1 !important; margin: 0 5px !important;
    }

    /* Grup Tombol (Di-press ke Kanan) */
    .opsi-group { 
        display: flex !important; flex-direction: row !important; align-items: center !important; 
        gap: 2px !important; flex-shrink: 0;
    }

    /* Tombol Interaktif Bulat */
    .btn-opsi {
        width: 22px !important; height: 22px !important; font-size: 9px !important;
        border-radius: 50% !important; font-weight: 800 !important; border: 1px solid rgba(0,0,0,0.05) !important;
        box-shadow: 0 2px 3px rgba(0,0,0,0.05) !important; color: #94a3b8 !important; background: #f8fafc !important;
        display: flex !important; align-items: center !important; justify-content: center !important; padding: 0 !important;
        cursor: pointer; transition: all 0.2s;
    }
    .btn-opsi.active { box-shadow: 0 0 8px currentColor !important; transform: scale(1.1) !important; border: none !important; }

    /* Pewarnaan Indikator (Glow) */
    .btn-hadir.active { background: #10b981 !important; color: white !important; }
    .btn-sakit.active { background: #f59e0b !important; color: white !important; }
    .btn-izin.active { background: #0ea5e9 !important; color: white !important; }
    .btn-alpa.active { background: #ef4444 !important; color: white !important; }

    .btn-bawa.active { background: #3b82f6 !important; color: white !important; }
    .btn-tbawa.active { background: #f97316 !important; color: white !important; }
    .btn-strip.active { background: #64748b !important; color: white !important; }
    
    .btn-sh.active { background: #10b981 !important; color: white !important; }
    .btn-ts.active { background: #ef4444 !important; color: white !important; }
    .btn-hd.active { background: #d946ef !important; color: white !important; }

    /* Tab Sholat Khusus (Input Teks Kecil Sebaris) */
    .input-ket-sholat {
        width: 55px !important; padding: 2px 4px !important; font-size: 9px !important; 
        margin-left: 3px !important; height: 22px !important; border-radius: 4px !important;
        border: 1px solid #ced4da !important; outline: none; flex-shrink: 0;
    }

    /* DESAIN LAYOUT DESKTOP 1 BARIS */
    .desktop-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 15px; }
    .desktop-row .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }
    
    .list-data { list-style: none; padding: 0; }
    .list-data li { padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: var(--abu-teks); display: flex; justify-content: space-between; align-items: center; }
    .btn-action { background: none; border: none; cursor: pointer; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action:hover { transform: scale(1.05); }
    .btn-edit { background: #eff6ff; color: #3b82f6; }
    .btn-delete { background: #fef2f2; color: #ef4444; }
</style>

<div class="presensi-container">
    
    <div class="tab-container">
        <button class="tab-btn active" id="btn-tab-kelas" onclick="gantiTabPresensi('kelas')"><i class="fa-solid fa-chalkboard-user"></i> Presensi Mengajar</button>
        <button class="tab-btn" id="btn-tab-sholat" onclick="gantiTabPresensi('sholat')"><i class="fa-solid fa-mosque"></i> Presensi Sholat</button>
    </div>

    <!-- ================= TAB 1: PRESENSI KELAS ================= -->
    <div id="tab-presensi-kelas" style="display: block;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-absen-kelas" class="form-control" onchange="bukaFormAbsenKelas()"></select>
            </div>
            
            <div id="area-absen-kelas" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div class="desktop-row">
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="input-tgl-absen-kelas" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Pertemuan Ke (Otomatis)</label>
                        <input type="number" id="input-pertemuan-ke" class="form-control" placeholder="Cth: 1" required>
                    </div>
                </div>

                <!-- HEADER TABEL STATIS -->
                <div class="header-tabel-presensi" style="margin-top: 20px;">
                    <div style="width: 24px; text-align:center;">No</div>
                    <div style="flex: 1; padding-left:5px;">Nama Siswa</div>
                    <div style="width: 92px; text-align: center;">Kehadiran</div>
                    <div style="width: 72px; text-align: center; margin-left: 2px;">Qur'an</div>
                </div>

                <div id="tempat-list-absen-kelas"></div>

                <button onclick="simpanPresensiKelas()" id="btn-simpan-absen-kelas" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 14px;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Transmit Data Presensi
                </button>
            </div>
        </div>

        <div class="card-data" id="area-riwayat-kelas" style="display: none;">
            <div style="font-size: 14px; font-weight: 700; color: var(--biru-tua); border-bottom: 1px solid var(--biru-muda); padding-bottom: 10px; margin-bottom: 15px;">Riwayat Presensi Mengajar</div>
            <ul class="list-data" id="tempat-riwayat-kelas"></ul>
        </div>
    </div>

    <!-- ================= TAB 2: PRESENSI SHOLAT ================= -->
    <div id="tab-presensi-sholat" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-absen-sholat" class="form-control" onchange="bukaFormAbsenSholat()"></select>
            </div>
            
            <div id="area-absen-sholat" style="display: none; margin-top: 15px; border-top: 1px dashed rgba(0,123,255,0.3); padding-top: 15px;">
                <div class="desktop-row">
                    <div class="form-group" style="flex: 1.5;">
                        <label>Tanggal</label>
                        <input type="date" id="input-tgl-absen-sholat" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label>Nama Sholat</label>
                        <select id="input-nama-sholat" class="form-control">
                            <option value="Dhuha">Dhuha</option>
                            <option value="Zuhur" selected>Zuhur</option>
                            <option value="Ashar">Ashar</option>
                            <option value="Jumat">Jumat</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Filter Tampilan</label>
                        <select id="filter-gender-sholat" class="form-control" onchange="terapkanFilterSholat()">
                            <option value="Semua">Semua Siswa</option>
                            <option value="L">Laki-laki Saja</option>
                            <option value="P">Perempuan Saja</option>
                        </select>
                    </div>
                </div>

                <!-- HEADER TABEL STATIS SHOLAT -->
                <div class="header-tabel-presensi" style="margin-top: 20px;">
                    <div style="width: 24px; text-align:center;">No</div>
                    <div style="flex: 1; padding-left:5px;">Nama Siswa</div>
                    <div style="width: 225px; text-align: center;">Kehadiran & Keterangan</div>
                </div>

                <div id="tempat-list-absen-sholat"></div>

                <button onclick="simpanPresensiSholat()" id="btn-simpan-absen-sholat" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Transmit Presensi Sholat
                </button>
            </div>
        </div>

        <div class="card-data" id="area-riwayat-sholat" style="display: none;">
            <div style="font-size: 14px; font-weight: 700; color: #0ea5e9; border-bottom: 1px solid var(--biru-muda); padding-bottom: 10px; margin-bottom: 15px;">Riwayat Presensi Sholat</div>
            <ul class="list-data" id="tempat-riwayat-sholat"></ul>
        </div>
    </div>

</div>
