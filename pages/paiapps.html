<!-- pages/paiapps.html -->
<style>
    /* =========================================================
       DYNAMIC THEME - PAI-APPS SHELL (DARK & LIGHT READY)
       ========================================================= */
    .paiapps-container { animation: fadeIn 0.4s ease-out; }

    /* SUB-TAB NAVIGASI UTAMA */
    .subtab-container { 
        display: flex; 
        background: var(--bg-card); 
        border-radius: 12px; 
        padding: 5px; 
        border: 1px solid var(--border-color); 
        margin-bottom: 20px; 
        gap: 5px;
    }
    .subtab-btn { 
        flex: 1; 
        background: transparent; 
        border: none; 
        padding: 10px 15px; 
        font-size: 12px; 
        font-weight: 600; 
        color: var(--text-abu); 
        cursor: pointer; 
        transition: all 0.3s; 
        border-radius: 8px; 
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .subtab-btn.active { 
        background: rgba(5, 213, 138, 0.15); 
        color: var(--neon-green); 
    }

    /* WADAH KONTEN SUB-HALAMAN */
    #paiapps-sub-content {
        min-height: 300px;
        animation: fadeIn 0.3s ease-out;
    }
</style>

<div class="paiapps-container">
    
    <!-- NAVIGASI SUB-TAB -->
    <div class="subtab-container">
        <button class="subtab-btn active" id="btn-subtab-dashboard" onclick="bukaSubTabPaiApps('dashboard')">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard Ringkasan</span>
        </button>
        <button class="subtab-btn" id="btn-subtab-tools" onclick="bukaSubTabPaiApps('tools')">
            <i class="fa-solid fa-toolbox"></i> <span>Tools & APPS</span>
        </button>
    </div>

    <!-- WADAH DINAMIS UNTUK FILE SUB-HALAMAN -->
    <div id="paiapps-sub-content">
        <div style="text-align:center; padding: 40px 10px; color: var(--neon-green);">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px;"></i>
            <p style="font-size: 12px; margin-top: 10px; color: var(--text-abu);">Memuat modul...</p>
        </div>
    </div>

</div>
