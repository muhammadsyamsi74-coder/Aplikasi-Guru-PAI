<!-- pages/jurnal.html -->
<style>
    /* =========================================================
       PREMIUM DARK NEON THEME - JURNAL
       ========================================================= */
    :root {
        --bg-main: #0b121e;
        --bg-card: #151d2a;
        --border-color: #232f40;
        --text-putih: #ffffff;
        --text-abu: #8494a8;
        --neon-green: #05d58a;
        --neon-blue: #3b82f6;
        --neon-yellow: #f59e0b;
        --neon-red: #ef4444;
        --neon-purple: #8b5cf6;
        --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #05d58a 100%);
        --gradient-blue: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        --gradient-purple: linear-gradient(135deg, #4c1d95 0%, #8b5cf6 100%);
    }

    .jurnal-container { animation: fadeIn 0.4s ease-out; }
    
    /* DESAIN KARTU GELAP */
    .card-data { 
        background: var(--bg-card); 
        border-radius: 16px; padding: 20px; 
        border: 1px solid var(--border-color); margin-bottom: 20px; 
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border-color); }
    .card-header h3 { font-size: 14px; font-weight: 700; color: var(--text-putih); margin: 0; }

    /* FORM INPUT */
    .form-group { margin-bottom: 15px; width: 100%; }
    .form-group label { display: block; font-size: 10px; color: var(--text-abu); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { 
        width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 12px; 
        font-size: 13px; color: var(--text-putih); outline: none; transition: all 0.3s ease; 
        background: var(--bg-main); font-weight: 500;
    }
    .form-control:focus { border-color: var(--neon-green); box-shadow: 0 0 0 4px rgba(5, 213, 138, 0.1); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    /* TOMBOL SIMPAN PREMIUM */
    .btn-primary {
        background: var(--gradient-primary); border: none; border-radius: 16px;
        color: white; font-weight: 700; font-size: 14px; box-shadow: 0 8px 20px rgba(5, 213, 138, 0.2);
        transition: all 0.3s ease; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 20px;
    }
    .btn-primary:active { transform: scale(0.98); }
    .icon-circle { background: rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink:0;}

    /* Varian Warna Tombol */
    .btn-blue { background: var(--gradient-blue); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2); }
    .btn-purple { background: var(--gradient-purple); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2); }

    .btn-cancel { 
        background: rgba(239, 68, 68, 0.1); color: var(--neon-red); border: 1px dashed rgba(239, 68, 68, 0.3); 
        display: none; text-align: center; margin-top: 15px; padding: 12px; border-radius: 12px; 
        font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s;
    }
    .btn-cancel:hover { background: var(--neon-red); color: white; border-style: solid; }

    /* DESAIN TAB (PILL SHAPE DARK) */
    .tab-container { 
        display: flex; background: var(--bg-card); border-radius: 12px; padding: 6px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid var(--border-color);
        overflow-x: auto; scrollbar-width: none; margin-top: 5px; 
    }
    .tab-container::-webkit-scrollbar { display: none; }
    .tab-btn { 
        flex: 1; background: transparent; border: none; padding: 12px 20px; 
        font-size: 12px; font-weight: 600; color: var(--text-abu); cursor: pointer; white-space: nowrap; 
        transition: all 0.3s; border-radius: 8px; text-align: center;
    }
    .tab-btn.active { background: rgba(5, 213, 138, 0.1); color: var(--neon-green); }

    .desktop-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 15px; }
    .desktop-row .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }

    /* KELENGKAPAN LIST & ACTION BTN */
    .list-data { list-style: none; padding: 0; }
    .list-data li { padding: 15px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-putih); display: flex; justify-content: space-between; align-items: center; }
    .list-data li:last-child { border-bottom: none; }
    .btn-action { background: var(--bg-main); border: 1px solid var(--border-color); cursor: pointer; padding: 8px 12px; font-size: 11px; font-weight: 700; border-radius: 8px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action:hover { transform: scale(1.05); }
    .btn-edit { color: var(--neon-blue); }
    .btn-delete { color: var(--neon-red); }

    /* CHECKBOX & KOTAK SISWA (DARK THEME) */
    .check-all-wrapper { display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(5, 213, 138, 0.05); border-radius: 12px; font-weight: 600; font-size: 12px; color: var(--neon-green); margin-bottom: 10px; border: 1px solid rgba(5, 213, 138, 0.2); }
    .check-all-wrapper input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--neon-green); }
    
    .student-list-box { max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; background: var(--bg-main); }
    .student-checkbox-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; border-radius: 6px; }
    .student-checkbox-item:hover { background: var(--bg-card); }
    .student-checkbox-item:last-child { border-bottom: none; }
    .student-checkbox-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--neon-green); }
    .student-checkbox-item span { font-size: 12px; color: var(--text-putih); font-weight: 500; }
    
    .student-list-box::-webkit-scrollbar { width: 6px; }
    .student-list-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
</style>

<div class="jurnal-container">
    
    <div class="tab-container">
        <button class="tab-btn active" id="btn-tab-mengajar" onclick="gantiTabJurnal('mengajar')">Jurnal Mengajar</button>
        <button class="tab-btn" id="btn-tab-sikap" onclick="gantiTabJurnal('sikap')">Jurnal Sikap</button>
        <button class="tab-btn" id="btn-tab-wali" onclick="gantiTabJurnal('wali')">Guru Wali</button>
    </div>

    <!-- ================= TAB 1: JURNAL MENGAJAR ================= -->
    <div id="tab-jurnal-mengajar" style="display: block;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-mengajar" class="form-control" onchange="setAutoPertemuanMengajar()"></select>
            </div>
            
            <div class="desktop-row">
                <div class="form-group" style="flex: 1;">
                    <label>Tanggal</label>
                    <input type="date" id="jm-tanggal" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 0.5;">
                    <label>Pertemuan Ke</label>
                    <input type="number" id="jm-pertemuan" class="form-control" placeholder="Cth: 1">
                </div>
                <div class="form-group" style="flex: 0.5;">
                    <label>Jam Ke</label>
                    <input type="text" id="jm-jam" class="form-control" placeholder="Cth: 1-2">
                </div>
            </div>
            <div class="form-group">
                <label>Judul Materi</label>
                <input type="text" id="jm-judul" class="form-control" placeholder="Cth: Rukun Iman">
            </div>
            <div class="form-group">
                <label>Deskripsi Materi / Kegiatan</label>
                <textarea id="jm-deskripsi" class="form-control" placeholder="Siswa melakukan diskusi tentang..."></textarea>
            </div>
            <div class="form-group">
                <label>Refleksi Guru</label>
                <textarea id="jm-refleksi" class="form-control" placeholder="Metode yang digunakan efektif..."></textarea>
            </div>

            <button onclick="simpanJurnalMengajar()" id="btn-simpan-mengajar" class="btn-primary" style="width: 100%; margin-top: 15px;">
                <span style="flex:1; text-align:left;">Simpan Jurnal Mengajar</span>
                <div class="icon-circle"><i class="fa-solid fa-check"></i></div>
            </button>
            <div id="btn-cancel-mengajar" class="btn-cancel" onclick="batalkanEdit('mengajar')">Batal Edit</div>
        </div>

        <div class="card-data">
            <div class="card-header">
                <h3>Riwayat Jurnal Mengajar</h3>
            </div>
            <div class="form-group">
                <select id="filter-riwayat-mengajar" class="form-control" onchange="loadRiwayatMengajar()">
                    <option value="">Semua Kelas</option>
                </select>
            </div>
            <ul class="list-data" id="list-riwayat-mengajar"></ul>
        </div>
    </div>

    <!-- ================= TAB 2: JURNAL SIKAP ================= -->
    <div id="tab-jurnal-sikap" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-sikap" class="form-control" onchange="loadSiswaJurnal('sikap')"></select>
            </div>
            
            <div id="area-sikap" style="display: none;">
                <div class="form-group">
                    <label>Pilih Siswa (Ceklis yang bersangkutan)</label>
                    <div class="check-all-wrapper" id="wrap-check-all-sikap">
                        <input type="checkbox" id="check-all-sikap" onclick="togglePilihSemua('sikap')"> 
                        <label for="check-all-sikap" style="margin:0; cursor:pointer; color:var(--text-putih);">Pilih Semua Siswa</label>
                    </div>
                    <div class="student-list-box" id="list-siswa-sikap"></div>
                </div>

                <div class="desktop-row">
                    <div class="form-group" style="flex: 1;">
                        <label>Tanggal</label>
                        <input type="date" id="js-tanggal" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Jenis Sikap</label>
                        <select id="js-jenis" class="form-control">
                            <option value="Positif">Positif</option>
                            <option value="Negatif">Negatif</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label>Kategori</label>
                        <select id="js-kategori" class="form-control">
                            <option value="Kedisiplinan">Kedisiplinan</option>
                            <option value="Etika/Sosial">Etika/Sosial</option>
                            <option value="Spiritual">Spiritual</option>
                            <option value="Kepemimpinan">Kepemimpinan</option>
                            <option value="Jujur">Jujur</option>
                            <option value="Adil">Adil</option>
                            <option value="Kebersihan">Kebersihan</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Deskripsi Kejadian</label>
                    <textarea id="js-deskripsi" class="form-control" placeholder="Membantu membersihkan papan tulis..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tindak Lanjut / Refleksi</label>
                    <textarea id="js-refleksi" class="form-control" placeholder="Diberikan apresiasi..."></textarea>
                </div>

                <button onclick="simpanJurnalSikap()" id="btn-simpan-sikap" class="btn-primary btn-blue" style="width: 100%; margin-top: 15px;">
                    <span style="flex:1; text-align:left;">Simpan Jurnal Sikap</span>
                    <div class="icon-circle"><i class="fa-solid fa-check"></i></div>
                </button>
                <div id="btn-cancel-sikap" class="btn-cancel" onclick="batalkanEdit('sikap')">Batal Edit</div>
            </div>
        </div>

        <div class="card-data">
            <div class="card-header">
                <h3>Riwayat Jurnal Sikap</h3>
            </div>
            <div class="desktop-row">
                <div class="form-group">
                    <select id="filter-riwayat-sikap" class="form-control" onchange="loadRiwayatSikap()">
                        <option value="">Semua Kelas</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <input type="text" id="search-nama-sikap" class="form-control" placeholder="Cari nama siswa..." onkeyup="loadRiwayatSikap()">
                </div>
            </div>
            <ul class="list-data" id="list-riwayat-sikap"></ul>
        </div>
    </div>

    <!-- ================= TAB 3: JURNAL WALI ================= -->
    <div id="tab-jurnal-wali" style="display: none;">
        <div class="card-data">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="pilih-kelas-wali" class="form-control" onchange="loadSiswaJurnal('wali')"></select>
            </div>
            
            <div id="area-wali" style="display: none;">
                <div class="form-group">
                    <label>Pilih Siswa (Ceklis yang bersangkutan)</label>
                    <div class="check-all-wrapper" id="wrap-check-all-wali">
                        <input type="checkbox" id="check-all-wali" onclick="togglePilihSemua('wali')"> 
                        <label for="check-all-wali" style="margin:0; cursor:pointer; color:var(--text-putih);">Pilih Semua Siswa</label>
                    </div>
                    <div class="student-list-box" id="list-siswa-wali"></div>
                </div>

                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="jw-tanggal" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi Pembinaan / Masalah</label>
                    <textarea id="jw-deskripsi" class="form-control" placeholder="Terlambat 3 hari berturut-turut..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tindak Lanjut</label>
                    <textarea id="jw-tindak" class="form-control" placeholder="Pemanggilan orang tua..."></textarea>
                </div>
                <div class="form-group">
                    <label>Refleksi</label>
                    <textarea id="jw-refleksi" class="form-control" placeholder="Siswa berjanji untuk..."></textarea>
                </div>

                <button onclick="simpanJurnalWali()" id="btn-simpan-wali" class="btn-primary btn-purple" style="width: 100%; margin-top: 15px;">
                    <span style="flex:1; text-align:left;">Simpan Jurnal Wali</span>
                    <div class="icon-circle"><i class="fa-solid fa-check"></i></div>
                </button>
                <div id="btn-cancel-wali" class="btn-cancel" onclick="batalkanEdit('wali')">Batal Edit</div>
            </div>
        </div>

        <div class="card-data">
            <div class="card-header">
                <h3>Riwayat Jurnal Wali</h3>
            </div>
            <div class="desktop-row">
                <div class="form-group">
                    <select id="filter-riwayat-wali" class="form-control" onchange="loadRiwayatWali()">
                        <option value="">Semua Kelas</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <input type="text" id="search-nama-wali" class="form-control" placeholder="Cari nama siswa..." onkeyup="loadRiwayatWali()">
                </div>
            </div>
            <ul class="list-data" id="list-riwayat-wali"></ul>
        </div>
    </div>

</div>
